frr version 9.1
frr defaults traditional
hostname R1
log syslog informational
no ipv6 forwarding
!
! ==============================================================
! R1 — AS 1
! Interfaces mapeadas no docker-compose:
!   eth0 = 10.0.0.1/30   link para R2
!   eth1 = 150.1.1.1/24  LAN compartilhada com R4
! Loopback simulado via interface dummy (lo)
! ==============================================================
!
interface lo
 ip address 1.1.1.1/32
!
interface eth0
 description Link_R1-R2
!
interface eth1
 description LAN_R1-R4
!
! Rotas estáticas para alcançar loopbacks dos peers
! (equivalente ao "ip route" do IOS para ebgp-multihop via loopback)
ip route 2.2.2.2/32 10.0.0.2
ip route 4.4.4.4/32 150.1.1.4
!
router bgp 1
 bgp router-id 1.1.1.1
 !
 neighbor 2.2.2.2 remote-as 2
 neighbor 2.2.2.2 update-source lo
 neighbor 2.2.2.2 ebgp-multihop 3
 neighbor 2.2.2.2 description Peer_R2_AS2
 !
 neighbor 4.4.4.4 remote-as 4
 neighbor 4.4.4.4 update-source lo
 neighbor 4.4.4.4 ebgp-multihop 3
 neighbor 4.4.4.4 description Peer_R4_AS4
 !
 address-family ipv4 unicast
  ! Anuncia a LAN local com ORIGIN=incomplete (equivalente ao
  ! redistribute connected route-map do livro)
  network 150.1.1.0/24
 exit-address-family
!
! ==============================================================
! TAREFA 1 — AS-Path Prepend
! Descomente o bloco abaixo após entender o comportamento padrão
! Objetivo: forçar R4 a preferir o caminho via R3 para qualquer
! prefixo de AS1, tornando o AS_PATH mais longo na direção R1->R4
! ==============================================================
!
! route-map PREP permit 10
!  set as-path prepend 1 1 1 1
! !
! router bgp 1
!  neighbor 4.4.4.4 route-map PREP out
!
line vty
!
end
