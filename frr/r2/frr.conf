frr version 9.1
frr defaults traditional
hostname R2
log syslog informational
no ipv6 forwarding
!
! ==============================================================
! R2 — AS 2
! Interfaces mapeadas no docker-compose:
!   eth0 = 10.0.0.2/30   link para R1
!   eth1 = 10.0.0.9/30   link para R3
!   eth2 = 150.2.2.1/24  LAN R2
! ==============================================================
!
interface lo
 ip address 2.2.2.2/32
!
! Loopbacks extras (prefixos anunciados no lab — simulados como /24)
interface lo:1
 ip address 192.1.1.1/24
interface lo:2
 ip address 193.1.1.1/24
interface lo:3
 ip address 194.1.1.1/24
interface lo:4
 ip address 195.1.1.1/24
!
interface eth0
 description Link_R2-R1
!
interface eth1
 description Link_R2-R3
!
interface eth2
 description LAN_R2
!
ip route 1.1.1.1/32 10.0.0.1
ip route 3.3.3.3/32 10.0.0.10
!
router bgp 2
 bgp router-id 2.2.2.2
 !
 neighbor 1.1.1.1 remote-as 1
 neighbor 1.1.1.1 update-source lo
 neighbor 1.1.1.1 ebgp-multihop 3
 neighbor 1.1.1.1 description Peer_R1_AS1
 !
 neighbor 3.3.3.3 remote-as 3
 neighbor 3.3.3.3 update-source lo
 neighbor 3.3.3.3 ebgp-multihop 3
 neighbor 3.3.3.3 description Peer_R3_AS3
 !
 address-family ipv4 unicast
  network 150.2.2.0/24
 exit-address-family
!
! ==============================================================
! TAREFA 2 — MED
! Descomente após configurar o AS-Path Prepend e observar o
! comportamento de R3. Objetivo: R2 envia MED=2 para R3.
! ==============================================================
!
! route-map MED permit 10
!  set metric 2
! !
! router bgp 2
!  neighbor 3.3.3.3 route-map MED out
!
line vty
!
end
