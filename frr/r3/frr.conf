frr version 9.1
frr defaults traditional
hostname R3
log syslog informational
no ipv6 forwarding
!
! ==============================================================
! R3 — AS 3
! Interfaces mapeadas no docker-compose:
!   eth0 = 10.0.0.10/30  link para R2
!   eth1 = 10.0.0.17/29  link para R4 (primeiro)
!   eth2 = 10.0.0.25/29  link para R4 (segundo)
!   eth3 = 150.3.3.3/24  LAN R3
! ==============================================================
!
interface lo
 ip address 3.3.3.3/32
!
interface eth0
 description Link_R3-R2
!
interface eth1
 description Link_R3-R4_A
!
interface eth2
 description Link_R3-R4_B
!
interface eth3
 description LAN_R3
!
ip route 2.2.2.2/32 10.0.0.9
ip route 4.4.4.4/32 10.0.0.18
ip route 4.4.4.4/32 10.0.0.26
!
router bgp 3
 bgp router-id 3.3.3.3
 !
 neighbor 2.2.2.2 remote-as 2
 neighbor 2.2.2.2 update-source lo
 neighbor 2.2.2.2 ebgp-multihop 3
 neighbor 2.2.2.2 description Peer_R2_AS2
 !
 neighbor 4.4.4.4 remote-as 4
 neighbor 4.4.4.4 update-source lo
 neighbor 4.4.4.4 ebgp-multihop 3
 neighbor 4.4.4.4 description Peer_R4_AS4
 !
 address-family ipv4 unicast
  network 150.3.3.0/24
 exit-address-family
!
! ==============================================================
! TAREFA 2 — MED (parte R3)
! Descomente para habilitar comparação de MED entre diferentes AS
! e ignorar AS_PATH no processo de decisão BGP.
! Estes são os dois comandos-chave do lab para MED funcionar:
!   bgp always-compare-med  → compara MED mesmo de AS diferentes
!   bgp bestpath as-path ignore → ignora AS_PATH na decisão
! ==============================================================
!
! router bgp 3
!  bgp always-compare-med
!  bgp bestpath as-path ignore
!
line vty
!
end
