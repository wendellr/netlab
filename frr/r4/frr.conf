frr version 9.1
frr defaults traditional
hostname R4
log syslog informational
no ipv6 forwarding
!
! ==============================================================
! R4 — AS 4
! Interfaces mapeadas no docker-compose:
!   eth0 = 150.1.1.4/24  LAN compartilhada com R1
!   eth1 = 10.0.0.18/29  link para R3 (primeiro)
!   eth2 = 10.0.0.26/29  link para R3 (segundo)
! ==============================================================
!
interface lo
 ip address 4.4.4.4/32
!
interface eth0
 description LAN_R4-R1
!
interface eth1
 description Link_R4-R3_A
!
interface eth2
 description Link_R4-R3_B
!
ip route 1.1.1.1/32 150.1.1.1
ip route 3.3.3.3/32 10.0.0.17
ip route 3.3.3.3/32 10.0.0.25
!
router bgp 4
 bgp router-id 4.4.4.4
 !
 neighbor 1.1.1.1 remote-as 1
 neighbor 1.1.1.1 update-source lo
 neighbor 1.1.1.1 ebgp-multihop 3
 neighbor 1.1.1.1 description Peer_R1_AS1
 !
 neighbor 3.3.3.3 remote-as 3
 neighbor 3.3.3.3 update-source lo
 neighbor 3.3.3.3 ebgp-multihop 3
 neighbor 3.3.3.3 description Peer_R3_AS3
 !
 address-family ipv4 unicast
  network 150.1.1.0/24
 exit-address-family
!
! ==============================================================
! TAREFA 2 — MED (parte R4)
! Descomente para R4 enviar MED=4 para R3.
! Compare com MED=2 de R2: R3 deve preferir R2 (menor MED).
! ATENÇÃO: só funciona após habilitar always-compare-med em R3!
! ==============================================================
!
! route-map MED permit 10
!  set metric 4
! !
! router bgp 4
!  neighbor 3.3.3.3 route-map MED out
!
line vty
!
end
