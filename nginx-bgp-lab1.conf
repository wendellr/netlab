# =============================================================
# Nginx — Proxy reverso para terminais web do BGP Lab 1
# Coloque este arquivo em:
#   /etc/nginx/conf.d/bgp-lab1.conf
# ou dentro do seu vhost existente como um include.
#
# Acesso dos alunos:
#   http://<seu-dominio>/bgp/r1
#   http://<seu-dominio>/bgp/r2
#   http://<seu-dominio>/bgp/r3
#   http://<seu-dominio>/bgp/r4
# =============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name lab.seudominio.com.br;  # <-- altere aqui

    # Redireciona / para a página de index dos roteadores
    location = / {
        return 301 /bgp/;
    }

    # Página de índice simples (opcional — ver bloco abaixo)
    location = /bgp/ {
        default_type text/html;
        return 200 '<html><head><meta charset="utf-8">
<title>BGP Lab 1</title>
<style>body{font-family:monospace;background:#1e1e1e;color:#d4d4d4;padding:40px}
a{color:#4fc3f7;font-size:1.2em;display:block;margin:10px 0}</style></head>
<body><h2>BGP Lab 1 — AS-Path Prepend + MED</h2>
<a href="/bgp/r1">&#9658; R1 — AS 1</a>
<a href="/bgp/r2">&#9658; R2 — AS 2</a>
<a href="/bgp/r3">&#9658; R3 — AS 3</a>
<a href="/bgp/r4">&#9658; R4 — AS 4</a>
</body></html>';
    }

    # ---------- R1 ----------
    location /bgp/r1 {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- R2 ----------
    location /bgp/r2 {
        proxy_pass http://127.0.0.1:7682;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- R3 ----------
    location /bgp/r3 {
        proxy_pass http://127.0.0.1:7683;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- R4 ----------
    location /bgp/r4 {
        proxy_pass http://127.0.0.1:7684;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
